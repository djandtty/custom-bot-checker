# Настройки мониторинга. Меняйте этот файл — код трогать не нужно.
# Подробности — в README.md.

settings:
  # record_low — уведомлять, только если цена ниже, чем в последнем уведомлении;
  # any_drop   — уведомлять при любом снижении относительно прошлой проверки.
  notify_mode: record_low
  top_n: 5                    # сколько лучших вариантов показывать
  request_pause: 1.0          # пауза между запросами к API, секунд
  max_requests_per_watch: 60  # лимит запросов на одно наблюдение за запуск

watches:
